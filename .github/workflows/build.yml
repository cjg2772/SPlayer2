name: Build Dev

on:
  push:
    branches:
      - master-fix
  workflow_dispatch:

jobs:
  release:
    name: Build and Electron app
    runs-on: windows-latest

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install pnpm
        run: npm install pnpm@8.14.0 -g

      - name: Copy .env.example
        run: |
          if (-not (Test-Path .env)) {
            Copy-Item .env.example .env
          } else {
            Write-Host ".env file already exists. Skipping the copy step."
          }

      - name: Install Dependencies
        run: pnpm install

      - name: Build Electron App
        run: pnpm run build:win
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Cleanup Artifacts
        run: npx rimraf "dist/!(*.exe)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LCY-Music-Pro-dev
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref }}-rc
          body: |
            This version is still under development, currently only provides windows version, non-developers please do not use!
          draft: false
          prerelease: true
          files: dist/*.exe
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
